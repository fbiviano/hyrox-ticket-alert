name = "roxracealerts"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# Node Buffer etc. - needed by jpeg-js (Instagram card rendering).
compatibility_flags = ["nodejs_compat"]

account_id = "57868dd73e0674a43c6ff3768d120883"

# Fonts for the Instagram card are bundled as binary data.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "roxracealerts-db"
database_id = "8b3ea91c-590a-4bb7-9ebd-24f732c85afb"

[vars]
SEND_FROM = "RoxRaceAlerts <alerts@alerts.roxracealerts.com>"
SITE_URL = "https://roxracealerts.com"
ADMIN_EMAIL = "francescobiviano609@gmail.com"
# WhatsApp Cloud API sending number. Currently Meta's free TEST number; swap for the real
# number's ID when one is registered. Not a secret - useless without WHATSAPP_TOKEN.
WHATSAPP_PHONE_NUMBER_ID = "1414773445051539"
# The number subscribers message to link WhatsApp (digits only). Meta's test number for now.
WHATSAPP_PUBLIC_NUMBER = "15556594991"
# The Meta app id (not a secret) - used to register the webhook through the API.
WHATSAPP_APP_ID = "1854886458861233"
TELEGRAM_BOT_USERNAME = "Alerts_hyrox_bot"
# Priority: free watchers get an alert this many minutes after Priority holders (only for alerts
# where someone holds Priority). PRIORITY_OPEN_TO_ALL = "1" shows the offers to everyone; until
# then only ADMIN_EMAIL sees them.
PRIORITY_FREE_DELAY_MINUTES = "3"
# Arms the alarm-driven fallback scheduler from any request (see CheckScheduler). Production only.
SCHEDULER_AUTOSTART = "1"
# Priority offers for every visitor (live Stripe checkout verified 2026-10-26).
PRIORITY_OPEN_TO_ALL = "1"
# Day -> category ticket picker.
TICKET_GRID = "1"

# Secrets (set via `wrangler secret put`, not stored here):
#   RESEND_API_KEY
#   WEBHOOK_SECRET
#   APIFY_API_TOKEN    - Instagram ticket-announcement watcher
#   ANTHROPIC_API_KEY  - parses flagged Instagram captions (any language) into
#                        an event match + English summary before auto-publishing
#   TELEGRAM_BOT_TOKEN - mirrors alerts addressed to ADMIN_EMAIL to Telegram too
#   TELEGRAM_CHAT_ID   - (optional pair - alerts still email-only if unset)
#   TELEGRAM_WEBHOOK_SECRET - header secret Telegram echoes on /telegram/webhook calls (set via setWebhook)
#   WHATSAPP_TOKEN     - WhatsApp Cloud API token (alerts via WhatsApp; off if unset)
#   ADMIN_WHATSAPP     - admin phone, digits only with country code (test alerts go here)
#   WHATSAPP_VERIFY_TOKEN - handshake secret Meta uses when registering the webhook URL
#   WHATSAPP_APP_SECRET   - the Meta app secret; verifies the signature on every webhook
#   STRIPE_SECRET_KEY     - Stripe restricted key (live) for Priority checkout
#   STRIPE_WEBHOOK_SECRET - signing secret of the /stripe/webhook endpoint in Stripe
# Optional var WHATSAPP_OPEN_TO_ALL = "1" lets every verified subscriber link WhatsApp (default: admin only).

# Alarm-driven fallback scheduler (see CheckScheduler in src/index.ts).
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "CheckScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CheckScheduler"]

[limits]
# Free plan hard-caps CPU time at 10ms per invocation (not configurable) -
# the */2 * * * * cron's four checking functions (HTML/JSON parsing across
# a growing tracked-event list) kept exceeding that and getting killed
# mid-run. 1000ms is generous headroom over realistic usage now that we're
# on Workers Paid, which allows up to 30000ms - can raise further later at
# no extra cost if ever needed.
cpu_ms = 1000

[triggers]
# */2 * * * *  - re-checks watched tickets (checkCommunityTickets)
# 0 3 * * *    - daily event-directory indexing batch (indexEvents)
# 0 8 * * *    - daily Instagram ticket-announcement check (checkInstagramAnnouncements)
# Frequent check registered as "1-59/2" (odd minutes) rather than "*/2": the "*/2" trigger on this
# script stopped being invoked by Cloudflare on 2026-10-23 and re-creating it did not help.
crons = ["1-59/2 * * * *", "0 3 * * *", "0 8 * * *"]

[[routes]]
pattern = "roxracealerts.com/*"
zone_name = "roxracealerts.com"

[[routes]]
pattern = "www.roxracealerts.com/*"
zone_name = "roxracealerts.com"

# ---------------------------------------------------------------------------
# Staging: a separate Worker + separate (fake-data) D1 database for building and
# testing before anything goes to production. Deploy with `wrangler deploy --env staging`.
# It has NO email/Telegram/WhatsApp/Apify/Anthropic secrets on purpose, so nothing it does can
# reach a real person; only Stripe TEST keys are set. Not routed on roxracealerts.com - it lives
# on its workers.dev address. Variables are not inherited between environments, hence repeated.
# ---------------------------------------------------------------------------
[env.staging]
name = "roxracealerts-staging"
workers_dev = true
routes = []

[env.staging.vars]
SEND_FROM = "RoxRaceAlerts Staging <staging@example.invalid>"
SITE_URL = "https://roxracealerts-staging.francescobiviano609.workers.dev"
ADMIN_EMAIL = "test@example.com"
# Short delay so the free-vs-Priority ordering is easy to watch while testing.
PRIORITY_FREE_DELAY_MINUTES = "1"
# Staging only: offer Priority to every visitor (production keeps it admin-only until launch).
PRIORITY_OPEN_TO_ALL = "1"
# New category-by-day ticket picker, staging only until confirmed.
TICKET_GRID = "1"
# Emails are written to email_log as "dry run" instead of being sent - staging never mails anyone.
EMAIL_DRY_RUN = "1"
TELEGRAM_BOT_USERNAME = "Alerts_hyrox_bot"

[env.staging.limits]
cpu_ms = 1000

[env.staging.triggers]
# No schedule: hyrox.com rate-limits Cloudflare, and staging polling only eats production's allowance.
# Staging checks run by hand (POST /admin/run-checks) or via the alarm scheduler when started.
crons = []

[[env.staging.durable_objects.bindings]]
name = "SCHEDULER"
class_name = "CheckScheduler"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "roxracealerts-staging-db"
database_id = "b58870ee-a945-492d-9f2a-b712b71acf12"
